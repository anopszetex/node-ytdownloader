name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Biome, lint, and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Biome
        run: npm exec -- biome check .

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test
